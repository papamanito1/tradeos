services:
  - type: web
    name: tradeos-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:///./tradeos.db
      - key: PAPER_TRADING
        value: "true"
      - key: ADMIN_USERNAME
        value: Kashan
      - key: ADMIN_PASSWORD
        value: Manan
      - key: CORS_ORIGINS
        value: "*"
